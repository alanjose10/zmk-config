# Build matrix for GitHub Actions CI (builds all keyboards on push/PR).
# For local builds, see local-build/build_setup.sh which defines
# per-keyboard build entries independently.
include:
  # - board: nice_nano//zmk
  #   shield: tester_pro_micro

  # Hillside - Mac
  - board: nice_nano//zmk
    shield: settings_reset
  - board: xiao_ble//zmk
    shield: settings_reset
  - board: nice_nano//zmk
    shield: hillside46mac_right
  - board: nice_nano//zmk
    shield: hillside46mac_left
  - board: xiao_ble//zmk
    shield: hillside46mac_dongle prospector_adapter
  - board: nice_nano//zmk
    shield: hillside46mac_dongle

  # Hillside - Linux
  - board: nice_nano//zmk
    shield: hillside46linux_right
  - board: nice_nano//zmk
    shield: hillside46linux_left
  - board: xiao_ble//zmk
    shield: hillside46linux_dongle prospector_adapter
  - board: nice_nano//zmk
    shield: hillside46linux_dongle

  # Kyria
  - board: nice_nano//zmk
    shield: kyria_rev3_left
  - board: nice_nano//zmk
    shield: kyria_rev3_right
  - board: xiao_ble//zmk
    shield: kyria_rev3_dongle
