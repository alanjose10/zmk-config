# Build matrix for GitHub Actions CI (builds all keyboards on push/PR).
# For local builds, see local-build/build_setup.sh which defines
# per-keyboard build entries independently.
include:
  # - board: nice_nano//zmk
  #   shield: tester_pro_micro

  # Hillside
  - board: nice_nano//zmk
    shield: settings_reset
  - board: xiao_ble//zmk
    shield: settings_reset
  - board: nice_nano//zmk
    shield: hillside46_right
  - board: nice_nano//zmk
    shield: hillside46_left
  - board: xiao_ble//zmk
    shield: hillside46_dongle dongle_screen
  - board: nice_nano//zmk
    shield: hillside46_dongle
  # makerdiary nRF52840 MDK USB Dongle (boards/makerdiary/nrf52840_mdk_usb_dongle)
  - board: nrf52840_mdk_usb_dongle//zmk
    shield: settings_reset
  - board: nrf52840_mdk_usb_dongle//zmk
    shield: hillside46_dongle

  # Kyria
  - board: nice_nano//zmk
    shield: kyria_rev3_left
  - board: nice_nano//zmk
    shield: kyria_rev3_right
  - board: xiao_ble//zmk
    shield: kyria_rev3_dongle
