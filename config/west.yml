manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
    # - name: carrefinho
    #   url-base: https://github.com/carrefinho
    - name: janpfischer
      url-base: https://github.com/janpfischer
  projects:
    - name: zmk
      remote: zmkfirmware
      # Track main like the charybdis repo. Pin to a tag once v0.4 ships.
      revision: main
      import: app/west.yml
    - name: zmk-helpers
      remote: urob
      revision: main
    # - name: prospector-zmk-module
    #   remote: carrefinho
    #   revision: main
    - name: zmk-dongle-screen
      remote: janpfischer
      # main targets ZMK v0.3 / LVGL 8 and breaks every build's Kconfig on ZMK main.
      # upgrade-4.1 is the maintainer's Zephyr 4.1 branch (see upstream issue 29).
      revision: upgrade-4.1
  self:
    path: config
